name: iOS Build

# Builds the SAVO iOS app via Capacitor.
#
# Two modes:
#   1. Unsigned simulator/archive build  → always runs, no Apple secrets needed.
#                                          Useful for sanity-checking the Xcode project.
#   2. Signed App Store / TestFlight IPA → runs only when ALL signing secrets are
#                                          configured. Uploads to TestFlight automatically
#                                          when APP_STORE_CONNECT_* secrets are present.
#
# Required GitHub Secrets for a signed build:
#   IOS_P12_BASE64               base64 of your Apple Distribution .p12 certificate
#   IOS_P12_PASSWORD             password for the .p12
#   IOS_PROVISIONING_PROFILE_BASE64   base64 of the App Store provisioning profile (.mobileprovision)
#   IOS_KEYCHAIN_PASSWORD        any strong random string (used for the temp build keychain)
#   IOS_TEAM_ID                  your 10-char Apple Team ID (e.g. ABCDE12345)
#   IOS_BUNDLE_ID                bundle identifier — defaults to nz.co.savo.app
#
# Optional (enables automatic TestFlight upload via App Store Connect API):
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_BASE64    base64 of the .p8 private key
#
# Generating the base64 values locally:
#   base64 -i Certificates.p12              | pbcopy
#   base64 -i SAVO_AppStore.mobileprovision | pbcopy
#   base64 -i AuthKey_XXXXXX.p8             | pbcopy

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto         # signed if secrets exist, otherwise unsigned
          - unsigned     # always unsigned (no signing required)
          - signed       # always signed (fails if secrets missing)

jobs:
  build:
    # iOS toolchain only runs on macOS runners
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'nz.co.savo.app' }}
      SCHEME: App
      XCODE_PROJECT: ios/App/App.xcodeproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode with iOS SDK
        run: |
          set -e
          for XCODE_APP in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.app \
            /Applications/Xcode.app
          do
            if [ -d "$XCODE_APP" ]; then
              sudo xcode-select -s "$XCODE_APP"
              if xcodebuild -showsdks | grep -q "iphoneos"; then
                echo "Selected $XCODE_APP"
                exit 0
              fi
              echo "$XCODE_APP does not include an iPhoneOS SDK; trying next Xcode."
            fi
          done
          echo "::error::No installed Xcode with an iPhoneOS SDK was found on this runner."
          exit 1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform if missing
        run: |
          set -e
          echo "--- Repo root contents ---"
          ls -la
          if [ -d "ios" ]; then
            echo "--- ios/ contents ---"
            ls -la ios || true
            if [ -d "ios/App" ]; then
              echo "--- ios/App contents ---"
              ls -la ios/App || true
            fi
          fi
          if [ ! -d "ios/App/App.xcodeproj" ] || [ ! -f "ios/App/CapApp-SPM/Package.swift" ]; then
            echo "No complete Capacitor iOS SPM project found — (re)adding iOS platform"
            rm -rf ios
            npx cap add ios --packagemanager SPM
            echo "--- After cap add: ios/App contents ---"
            ls -la ios/App || true
          else
            echo "Capacitor iOS SPM project already exists — skipping cap add"
          fi
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "::error::ios/App/App.xcodeproj is still missing after cap add. Check the diagnostics above."
            exit 1
          fi
          if [ ! -f "ios/App/CapApp-SPM/Package.swift" ]; then
            echo "::error::ios/App/CapApp-SPM/Package.swift is still missing after cap add. Check the diagnostics above."
            exit 1
          fi

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Install CocoaPods if project uses Podfile
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod repo update
            pod install
          else
            echo "No Podfile found; Capacitor iOS is using Swift Package Manager."
          fi

      # ──────────────────────────────────────────────────────────────────
      # Decide whether we have what we need for a signed build
      # ──────────────────────────────────────────────────────────────────
      - name: Determine signing mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.build_mode }}
          P12: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          HAVE_SECRETS=no
          if [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            HAVE_SECRETS=yes
          fi
          MODE="$INPUT_MODE"
          if [ "$MODE" = "auto" ] || [ -z "$MODE" ]; then
            if [ "$HAVE_SECRETS" = "yes" ]; then MODE="signed"; else MODE="unsigned"; fi
          fi
          if [ "$MODE" = "signed" ] && [ "$HAVE_SECRETS" != "yes" ]; then
            echo "::error::Signed build requested but IOS_P12_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 / IOS_TEAM_ID are missing."
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Build mode: $MODE"

      # ──────────────────────────────────────────────────────────────────
      # Unsigned: archive without code signing (for verification only)
      # ──────────────────────────────────────────────────────────────────
      - name: Build (unsigned, archive only)
        if: steps.mode.outputs.mode == 'unsigned'
        working-directory: ios/App
        run: |
          mkdir -p build
          xcodebuild \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
          echo "Unsigned archive built. An IPA cannot be exported without signing."

      - name: Upload unsigned archive
        if: steps.mode.outputs.mode == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive
          path: ios/App/build/App.xcarchive
          retention-days: 7

      # ──────────────────────────────────────────────────────────────────
      # Signed: import cert + profile, then archive & export an .ipa
      # ──────────────────────────────────────────────────────────────────
      - name: Import signing certificate
        if: steps.mode.outputs.mode == 'signed'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          # Auto-generate ephemeral keychain password (no secret needed)
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

      - name: Install provisioning profile
        if: steps.mode.outputs.mode == 'signed'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          # Extract UUID and copy with that filename (Xcode looks them up by UUID)
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$PROFILES_DIR/$UUID.mobileprovision"
          echo "Installed provisioning profile UUID=$UUID"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build & archive (signed)
        if: steps.mode.outputs.mode == 'signed'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          mkdir -p build
          xcodebuild \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

      - name: Create export options plist
        if: steps.mode.outputs.mode == 'signed'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        if: steps.mode.outputs.mode == 'signed'
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        if: steps.mode.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 7

      # ──────────────────────────────────────────────────────────────────
      # Optional: upload to TestFlight via App Store Connect API
      # ──────────────────────────────────────────────────────────────────
      - name: Upload to TestFlight
        if: steps.mode.outputs.mode == 'signed' && env.HAS_ASC_KEY == 'true'
        env:
          HAS_ASC_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY != '' }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          # APPSTORE_PRIVATE_KEY may be either base64 or the raw .p8 contents.
          # Detect a PEM header to decide.
          if echo "$ASC_KEY" | head -1 | grep -q "BEGIN PRIVATE KEY"; then
            echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            echo "$ASC_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          fi
          IPA=$(ls ios/App/build/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup keychain
        if: always() && steps.mode.outputs.mode == 'signed'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
