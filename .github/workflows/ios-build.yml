name: iOS Build

# Builds the SAVO iOS app via Capacitor.
#
# Two modes:
#   1. Signed App Store / TestFlight IPA → default mode. Runs only when ALL signing secrets are
#                                          configured. Uploads to TestFlight automatically
#                                          when APP_STORE_CONNECT_* secrets are present.
#   2. Unsigned simulator/archive build  → only when explicitly selected. Useful for
#                                          sanity-checking Xcode, but will NOT appear in TestFlight.
#
# Required GitHub Secrets for a signed build:
#   IOS_P12_BASE64               base64 of your Apple Distribution .p12 certificate
#   IOS_P12_PASSWORD             password for the .p12
#   IOS_MOBILEPROVISION_BASE64   base64 of the App Store provisioning profile (.mobileprovision)
#   IOS_TEAM_ID                  your 10-char Apple Team ID (e.g. ABCDE12345)
#   IOS_BUNDLE_ID                bundle identifier — defaults to nz.co.savo.app
#
# Optional (enables automatic TestFlight upload via App Store Connect API):
#   APPSTORE_KEY_ID / APP_STORE_CONNECT_API_KEY_ID
#   APPSTORE_ISSUER_ID / APP_STORE_CONNECT_API_ISSUER_ID
#   APPSTORE_PRIVATE_KEY / APP_STORE_CONNECT_API_KEY_BASE64    raw or base64 .p8 private key
#
# Generating the base64 values locally:
#   base64 -i Certificates.p12              | pbcopy
#   base64 -i SAVO_AppStore.mobileprovision | pbcopy
#   base64 -i AuthKey_XXXXXX.p8             | pbcopy

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "signed"
        type: choice
        options:
          - signed       # default: App Store/TestFlight upload, fails if secrets missing
          - auto         # signed if secrets exist, otherwise unsigned
          - unsigned     # always unsigned (no signing required)

jobs:
  build:
    # iOS toolchain only runs on macOS runners.
    # macos-26 ships Xcode 26 (iOS 26 SDK), which Apple now requires for App Store uploads.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'nz.co.savo.app' }}
      SCHEME: App
      XCODE_PROJECT: ios/App/App.xcodeproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode with iOS 26 SDK
        run: |
          set -e
          echo "--- Available Xcode installations ---"
          ls /Applications | grep -i '^Xcode' || true
          # App Store Connect requires the iOS 26 SDK (Xcode 26+) as of April 2026.
          # Prefer Xcode 26.x; fall back to any Xcode that ships an iphoneos26.* SDK.
          CANDIDATES=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode-26*.app 2>/dev/null || true)
          # Also consider generic Xcode.app last
          CANDIDATES="$CANDIDATES /Applications/Xcode.app"
          for XCODE_APP in $CANDIDATES; do
            if [ -d "$XCODE_APP" ]; then
              sudo xcode-select -s "$XCODE_APP"
              SDK_LINE=$(xcodebuild -showsdks 2>/dev/null | grep -E "iphoneos26\." || true)
              if [ -n "$SDK_LINE" ]; then
                echo "Selected $XCODE_APP with SDK: $SDK_LINE"
                xcodebuild -version
                exit 0
              fi
              echo "$XCODE_APP does not include an iOS 26 SDK; trying next Xcode."
            fi
          done
          echo "::error::No installed Xcode with an iOS 26 SDK was found on this runner. Use a runner image that includes Xcode 26 (e.g. macos-15 with Xcode 26, or macos-26)."
          xcodebuild -showsdks || true
          exit 1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Ensure iOS 26 platform is installed
        run: |
          set -e
          # Some macos-26 runner images include Xcode 26 but do not have the
          # iOS device platform installed/enabled yet. In that state, archive
          # fails with either "iOS 26.0 is not installed" or "Found no
          # destinations" even when `xcodebuild -showsdks` lists iphoneos26.*.
          sudo xcodebuild -runFirstLaunch || true
          sudo xcodebuild -downloadPlatform iOS || true
          echo "--- Installed platforms ---"
          xcodebuild -showsdks || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform if missing
        run: |
          set -e
          echo "--- Repo root contents ---"
          ls -la
          if [ -d "ios" ]; then
            echo "--- ios/ contents ---"
            ls -la ios || true
            if [ -d "ios/App" ]; then
              echo "--- ios/App contents ---"
              ls -la ios/App || true
            fi
          fi
          if [ ! -d "ios/App/App.xcodeproj" ] || [ ! -f "ios/App/CapApp-SPM/Package.swift" ]; then
            echo "No complete Capacitor iOS SPM project found — (re)adding iOS platform"
            rm -rf ios
            npx cap add ios --packagemanager SPM
            echo "--- After cap add: ios/App contents ---"
            ls -la ios/App || true
          else
            echo "Capacitor iOS SPM project already exists — skipping cap add"
          fi
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "::error::ios/App/App.xcodeproj is still missing after cap add. Check the diagnostics above."
            exit 1
          fi
          if [ ! -f "ios/App/CapApp-SPM/Package.swift" ]; then
            echo "::error::ios/App/CapApp-SPM/Package.swift is still missing after cap add. Check the diagnostics above."
            exit 1
          fi

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Inject App Store icon into AppIcon.appiconset
        run: |
          set -e
          SRC="resources/ios-app-icon-1024.png"
          DEST_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC not found in repo. Commit the 1024x1024 icon to resources/ios-app-icon-1024.png."
            exit 1
          fi
          if [ ! -d "$DEST_DIR" ]; then
            echo "::error::$DEST_DIR not found. Did 'npx cap add ios' run successfully?"
            exit 1
          fi
          # Capacitor's default AppIcon.appiconset uses a single 1024x1024 marketing icon
          # named AppIcon-512@2x.png. Overwrite it with our branded SAVO icon.
          cp "$SRC" "$DEST_DIR/AppIcon-512@2x.png"
          echo "--- AppIcon.appiconset contents ---"
          ls -la "$DEST_DIR"
          # Sanity-check dimensions
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png")
          data = p.read_bytes()
          # PNG IHDR width/height at bytes 16..24
          w, h = struct.unpack(">II", data[16:24])
          assert (w, h) == (1024, 1024), f"Expected 1024x1024, got {w}x{h}"
          print(f"OK: {p.name} is {w}x{h}")
          PY

      - name: Inject required Info.plist usage strings
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::$PLIST not found"
            exit 1
          fi
          # Apple ITMS-90683: required because Capacitor/Geolocation references location APIs
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'SAVO uses your location to find nearby panel shops, tow companies, and to record where an incident occurred.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'SAVO uses your location to find nearby panel shops, tow companies, and to record where an incident occurred.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'SAVO uses your location to find nearby panel shops, tow companies, and to record where an incident occurred.'" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'SAVO uses your location to find nearby panel shops, tow companies, and to record where an incident occurred.'" "$PLIST"
          # Other sensitive APIs referenced via Capacitor plugins / SDKs
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'SAVO uses the camera to capture photos of vehicle damage and incident scenes.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'SAVO accesses your photo library so you can attach existing photos to claims.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'SAVO saves captured incident photos to your photo library.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'SAVO uses the microphone to record voice notes and call audio for claim documentation.'" "$PLIST" 2>/dev/null || true
          echo "--- Final Info.plist ---"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -A0 "Usage" || true

      - name: Install CocoaPods if project uses Podfile
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            pod repo update
            pod install
          else
            echo "No Podfile found; Capacitor iOS is using Swift Package Manager."
          fi

      # ──────────────────────────────────────────────────────────────────
      # Decide whether we have what we need for a signed build
      # ──────────────────────────────────────────────────────────────────
      - name: Determine signing mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.build_mode }}
          P12: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -e
          HAVE_SECRETS=no
          if [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            HAVE_SECRETS=yes
          fi
          MODE="$INPUT_MODE"
          if [ "$MODE" = "auto" ] || [ -z "$MODE" ]; then
            if [ "$HAVE_SECRETS" = "yes" ]; then MODE="signed"; else MODE="unsigned"; fi
          fi
          if [ "$MODE" = "signed" ] && [ "$HAVE_SECRETS" != "yes" ]; then
            echo "::error::Signed build requested but IOS_P12_BASE64 / IOS_MOBILEPROVISION_BASE64 / IOS_TEAM_ID are missing."
            exit 1
          fi
          if [ "$MODE" = "signed" ] && { [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ]; }; then
            echo "::error::Signed build is configured, but TestFlight upload secrets are missing. Add APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, and APPSTORE_PRIVATE_KEY GitHub secrets."
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Build mode: $MODE"

      # ──────────────────────────────────────────────────────────────────
      # Unsigned: archive without code signing (for verification only)
      # ──────────────────────────────────────────────────────────────────
      - name: Build (unsigned, archive only)
        if: steps.mode.outputs.mode == 'unsigned'
        working-directory: ios/App
        run: |
          mkdir -p build
          xcodebuild \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
          echo "Unsigned archive built. An IPA cannot be exported without signing."
          echo "::warning::This was an unsigned archive-only build. It will not appear in TestFlight. Re-run the workflow with build_mode=signed to upload to TestFlight."

      - name: Upload unsigned archive
        if: steps.mode.outputs.mode == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive
          path: ios/App/build/App.xcarchive
          retention-days: 7

      # ──────────────────────────────────────────────────────────────────
      # Signed: import cert + profile, then archive & export an .ipa
      # ──────────────────────────────────────────────────────────────────
      - name: Import signing certificate
        if: steps.mode.outputs.mode == 'signed'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          # Auto-generate ephemeral keychain password (no secret needed)
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

      - name: Install provisioning profile
        if: steps.mode.outputs.mode == 'signed'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$PROFILE_PLIST")
          # Strip the team prefix (e.g. "ABCDE12345.nz.co.savo.app" -> "nz.co.savo.app")
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"
          cp "$PROFILE_PATH" "$PROFILES_DIR/$UUID.mobileprovision"
          echo "Installed provisioning profile: $PROFILE_NAME (UUID=$UUID, bundle=$PROFILE_BUNDLE_ID)"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_BUNDLE_ID=$PROFILE_BUNDLE_ID" >> "$GITHUB_ENV"

          # Show which signing identities are available in our keychain
          echo "--- Available codesign identities ---"
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" || true

      - name: Build & archive (signed)
        if: steps.mode.outputs.mode == 'signed'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          mkdir -p build

          # Scope manual signing to the App target ONLY. SPM dependencies
          # (Facebook, GoogleSignIn, AppAuth, …) reject any provisioning
          # profile, so we use TARGET_NAME-conditional build settings via an
          # xcconfig overlay.
          XCCONFIG="$RUNNER_TEMP/Override.xcconfig"
          cat > "$XCCONFIG" <<EOF
          // Defaults for every target: no signing, no profile.
          CODE_SIGN_STYLE = Manual
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          PROVISIONING_PROFILE_SPECIFIER =
          DEVELOPMENT_TEAM =

          // Re-enable signing only for the App target.
          CODE_SIGNING_ALLOWED[sdk=iphoneos*][target=App] = YES
          CODE_SIGNING_REQUIRED[sdk=iphoneos*][target=App] = YES
          CODE_SIGN_STYLE[target=App] = Manual
          CODE_SIGN_IDENTITY[sdk=iphoneos*][target=App] = Apple Distribution
          DEVELOPMENT_TEAM[target=App] = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER[target=App] = ${PROFILE_UUID}
          PRODUCT_BUNDLE_IDENTIFIER[target=App] = ${PROFILE_BUNDLE_ID}
          EOF
          echo "--- xcconfig overlay ---"
          cat "$XCCONFIG"

          xcodebuild \
            -project App.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -xcconfig "$XCCONFIG" \
            -allowProvisioningUpdates=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Create export options plist
        if: steps.mode.outputs.mode == 'signed'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${PROFILE_BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        if: steps.mode.outputs.mode == 'signed'
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed IPA
        if: steps.mode.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ios/App/build/ipa/*.ipa
          retention-days: 7

      # ──────────────────────────────────────────────────────────────────
      # Optional: upload to TestFlight via App Store Connect API
      # ──────────────────────────────────────────────────────────────────
      - name: Upload to TestFlight
        if: steps.mode.outputs.mode == 'signed'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -e
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ]; then
            echo "::error::TestFlight upload secrets are missing. Add APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, and APPSTORE_PRIVATE_KEY GitHub secrets."
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          # APPSTORE_PRIVATE_KEY may be either base64 or the raw .p8 contents.
          # Detect a PEM header to decide.
          if echo "$ASC_KEY" | head -1 | grep -q "BEGIN PRIVATE KEY"; then
            echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            echo "$ASC_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          fi
          IPA=$(ls ios/App/build/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "✅ TestFlight upload command completed. Apple may take 10–60 minutes to process the build before it appears in TestFlight."
          echo "### TestFlight upload submitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple accepted the upload command for: $IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "If it is not visible immediately, check App Store Connect → TestFlight → Builds/Processing after 10–60 minutes." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup keychain
        if: always() && steps.mode.outputs.mode == 'signed'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
